# Increase Gradle daemon heap to avoid "Java heap space" OOM
# Adjust -Xmx based on system RAM (16 GB machine -> 4g is generally safe)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
# If using Kotlin, increase the Kotlin daemon heap as well
kotlin.daemon.jvm.options=-Xmx4g
android.useAndroidX=true